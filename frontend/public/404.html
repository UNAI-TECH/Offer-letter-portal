<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UNAI TECH – Virtual Internship Offer Letter Portal</title>
    <script>
      // Single Page Application redirect fallback for static hosts
      const path = window.location.pathname;
      const search = window.location.search;
      const hash = window.location.hash;
      // Redirect to root index with path preserved in query/hash
      window.location.replace('/' + (path && path !== '/' ? '#route=' + encodeURIComponent(path + search + hash) : ''));
    </script>
  </head>
  <body>
    <p>Redirecting to UNAI TECH Portal...</p>
  </body>
</html>
